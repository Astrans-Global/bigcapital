server {
    listen 80 default_server;

    root /usr/share/nginx/html;

    # One-time wipe for a stuck normal Chrome profile (Incognito already works).
    # Do NOT send Clear-Site-Data on every HTML page — that wipes auth/session.
    location = /astrans-reset.html {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Clear-Site-Data "\"cache\", \"cookies\", \"storage\"" always;
    }
    location = /__astrans_reset {
        rewrite ^ /astrans-reset.html last;
    }

    location = /index.html {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /preload-theme.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Old CRA service workers: 410 so normal-profile browsers unregister.
    # Without this, try_files serves index.html as the SW script and the tab
    # stays on a cached splash forever. Incognito has no SW, so it looks fine.
    location ~* ^/(service-worker\.js|sw\.js|precache-manifest.*\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-store" always;
        return 410;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri /index.html;
    }
}
