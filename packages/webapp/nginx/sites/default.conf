server {
    listen 80 default_server;

    root /usr/share/nginx/html;

    # index.html and unhashed public/ files (theme bootstrap, manifest, etc.)
    # must always be revalidated — their filenames never change on deploy, so
    # long-lived caching here would silently serve stale bugfixes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /preload-theme.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri /index.html;
    }
}